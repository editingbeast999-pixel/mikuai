<!-- Chat Toggle Button for Voice Mode -->
<button class="chat-toggle-btn" id="chat-toggle-btn" onclick="toggleChatView()" style="display: none;">
    <span class="material-icons">chat</span>
    <span>Show Chat</span>
</button>

<style>
    .chat-toggle-btn {
        position: fixed;
        bottom: 100px;
        right: 30px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border: none;
        color: white;
        padding: 12px 20px;
        border-radius: 25px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(255, 126, 179, 0.4);
        transition: all 0.3s ease;
        z-index: 200;
    }

    .chat-toggle-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 126, 179, 0.6);
    }

    .chat-toggle-btn.hidden {
        display: none !important;
    }
</style>

<script>
    function toggleChatView() {
        const chatContainer = document.getElementById('chat-container');
        const toggleBtn = document.getElementById('chat-toggle-btn');

        if (chatContainer.style.display === 'none') {
            // Show chat
            chatContainer.style.display = 'flex';
            toggleBtn.querySelector('span:last-child').textContent = 'Hide Chat';
        } else {
            // Hide chat
            chatContainer.style.display = 'none';
            toggleBtn.querySelector('span:last-child').textContent = 'Show Chat';
        }
    }
</script>
